# XcodeGen spec — run ./setup.sh rather than editing the generated .xcodeproj.
# TEAM_ID and BUNDLE_PREFIX come from the environment (setup.sh supplies them).
name: GoodnightPhone

options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

targets:
  # The app: settings UI + beacon monitoring (CLMonitor).
  GoodnightPhone:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    scheme:
      testTargets:
        - GoodnightPhoneTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Goodnight Phone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoodnightPhoneAppGroup: group.${BUNDLE_PREFIX}.goodnightphone
        UILaunchScreen: {}
        # No encryption beyond what iOS provides, so App Store Connect skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait only; opting out of iPad multitasking is required for App Store upload.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Goodnight Phone checks whether your iPhone is near your bedroom beacon so it can block the apps you chose at bedtime. Your location never leaves your phone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Choose “Always” so iOS can wake Goodnight Phone when you walk into the bedroom and block your chosen apps, even when the app is closed. Goodnight Phone only learns whether you’re near your beacon, and nothing leaves your phone."
        NSBluetoothAlwaysUsageDescription: "Goodnight Phone uses Bluetooth to set up your bedroom beacon and its range, or to connect your phone to a spare iPad or iPhone standing in as the beacon and tell how close you are to it."
        # Keeps the connection to the spare-device stand-in alive with the app closed (HubMonitor).
        UIBackgroundModes:
          - bluetooth-central
    entitlements:
      path: Support/GoodnightPhone.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.goodnightphone
    dependencies:
      - target: kbeaconlib2
      - target: GoodnightPhoneMonitor
      - target: GoodnightPhoneShield
      - target: GoodnightPhoneShieldAction

  # KKM's SDK for Blue Charm beacons, vendored unmodified (Vendor/kbeaconlib2/README.md). Lets the app
  # set up the recommended beacon and its range itself, so nobody needs the vendor's app.
  kbeaconlib2:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/kbeaconlib2
        excludes:
          - "*.md"
          - LICENSE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone.kbeaconlib2
        GENERATE_INFOPLIST_FILE: YES
        # Third-party code: don't fail or clutter the build on its warnings.
        SWIFT_SUPPRESS_WARNINGS: YES

  # Unit tests for the pure room-presence and schedule logic. Compiles those files directly instead of
  # hosting the app, so tests don't launch it (Screen Time and Bluetooth don't work in the Simulator).
  GoodnightPhoneTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Presence
      - path: Shared/BedtimeSchedule.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone.tests
        GENERATE_INFOPLIST_FILE: YES

  # Woken at the start/end of bedtime hours to apply or lift the shield.
  GoodnightPhoneMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone.monitor
    info:
      path: Support/Monitor-Info.plist
      properties:
        CFBundleDisplayName: Goodnight Phone Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GoodnightPhoneAppGroup: group.${BUNDLE_PREFIX}.goodnightphone
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Support/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.goodnightphone

  # The custom "Not in the bedroom" screen over blocked apps.
  GoodnightPhoneShield:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Shield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone.shield
    info:
      path: Support/Shield-Info.plist
      properties:
        CFBundleDisplayName: Goodnight Phone Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Support/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true

  # Handles the shield's Close button.
  GoodnightPhoneShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.goodnightphone.shieldaction
    info:
      path: Support/ShieldAction-Info.plist
      properties:
        CFBundleDisplayName: Goodnight Phone Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Support/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
