# XcodeGen spec — run ./setup.sh rather than editing the generated .xcodeproj.
# TEAM_ID and BUNDLE_PREFIX come from the environment (setup.sh supplies them).
name: LightsOut

options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"

targets:
  # The app: settings UI + beacon monitoring (CLMonitor).
  LightsOut:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    scheme:
      testTargets:
        - LightsOutTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.lightsout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: Lights Out
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LightsOutAppGroup: group.${BUNDLE_PREFIX}.lightsout
        UILaunchScreen: {}
        # No encryption beyond what iOS provides, so App Store Connect skips the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Lights Out checks whether your iPhone is near your bedroom beacon so it can block the apps you chose at bedtime. Your location never leaves your phone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Choose “Always” so iOS can wake Lights Out when you walk into the bedroom and block your chosen apps, even when the app is closed. Lights Out only learns whether you’re near your beacon, and nothing leaves your phone."
        NSBluetoothAlwaysUsageDescription: "Lights Out uses Bluetooth to connect your phone to a spare iPad or iPhone standing in as the bedroom beacon, and to tell how close you are to it."
        # Keeps the connection to the spare-device stand-in alive with the app closed (HubMonitor).
        UIBackgroundModes:
          - bluetooth-central
    entitlements:
      path: Support/LightsOut.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.lightsout
    dependencies:
      - target: LightsOutMonitor
      - target: LightsOutShield
      - target: LightsOutShieldAction

  # Unit tests for the pure room-presence logic. Compiles App/Presence directly instead of
  # hosting the app, so tests don't launch it (Screen Time and Bluetooth don't work in the Simulator).
  LightsOutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: App/Presence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.lightsout.tests
        GENERATE_INFOPLIST_FILE: YES

  # Woken at the start/end of bedtime hours to apply or lift the shield.
  LightsOutMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Monitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.lightsout.monitor
    info:
      path: Support/Monitor-Info.plist
      properties:
        CFBundleDisplayName: Lights Out Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LightsOutAppGroup: group.${BUNDLE_PREFIX}.lightsout
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: Support/Monitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.${BUNDLE_PREFIX}.lightsout

  # The custom "Not in the bedroom" screen over blocked apps.
  LightsOutShield:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Shield
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.lightsout.shield
    info:
      path: Support/Shield-Info.plist
      properties:
        CFBundleDisplayName: Lights Out Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: Support/Shield.entitlements
      properties:
        com.apple.developer.family-controls: true

  # Handles the shield's Close button.
  LightsOutShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.lightsout.shieldaction
    info:
      path: Support/ShieldAction-Info.plist
      properties:
        CFBundleDisplayName: Lights Out Shield Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: Support/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
