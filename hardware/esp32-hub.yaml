# Turns an ESP32 board into an always-on stand-in for the "spare iPad or iPhone" bedroom beacon.
# It speaks the same Bluetooth protocol as App/BeaconBroadcaster.swift, so the app needs no
# changes: on your iPhone choose Bedroom beacon → Change beacon… → Use a spare iPad or iPhone,
# then set the boundary standing in the bedroom doorway.
#
# Unlike the iPad it needs no app open on a screen, and no Wi-Fi: it gets the time from the phone
# over Bluetooth (heartbeats go out during bedtime hours only, like the iPad), so setup is just
# flash once, then plug into any USB charger in the bedroom.
#
# Tested target: Seeed Studio XIAO ESP32-C6. Other ESP32 boards: change the esp32 block and drop
# the antenna outputs.
#
#   Plug the board into your Mac and run: esphome run hardware/esp32-hub.yaml
#   Later updates: the same command, over USB.
#
# Protocol (see BeaconBroadcaster): primary service = BeaconConfig.standInUUID, advertised.
# Heartbeat characteristic: notify, value 0x01 every 2 s during the phone's bedtime hours, one 0x00
# when they end. Schedule characteristic: the phone writes its PhoneHours JSON
# ({"schedule": BedtimeSchedule, "timeZone": "...", "now": seconds since 1970, "utcOffset": seconds,
# "nextOffsetChange": seconds since 1970, "offsetAfterChange": seconds}). This board keeps each
# connected phone's hours separately (up to 3 phones) and beats while any of them is inside its
# hours. Until a phone has written since power-up it has no clock, and beats around the clock like
# the iPad does before it has hours.

esphome:
  name: bedroom-hub
  # XIAO ESP32-C6: GPIO3 low turns on the RF switch, GPIO14 low picks the built-in antenna.
  on_boot:
    priority: 800
    then:
      - output.turn_off: rf_switch_enable
      - output.turn_off: antenna_select

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  framework:
    type: esp-idf

output:
  - platform: gpio
    pin: GPIO3
    id: rf_switch_enable
  - platform: gpio
    pin: GPIO14
    id: antenna_select

logger:

json:

esp32_ble:

esp32_ble_server:
  manufacturer: "Goodnight Phone"
  # One per phone in the household.
  max_clients: 3
  on_disconnect:
    - lambda: |-
        for (int i = 0; i < 3; i++) if (id(slot_conn)[i] == id) id(slot_conn)[i] = -1;
  services:
    - uuid: E6B2E125-B543-4BA4-8D19-B68DBA9F147C
      advertise: true
      characteristics:
        - id: heartbeat
          uuid: 17FEA0BC-C577-41FE-B8A1-9604CDE1C469
          notify: true
          value:
            data: [0]
        - id: schedule
          uuid: 8C4D4E0A-2F5B-4B8E-9C1D-3A6F7E2B5D90
          write: true
          on_write:
            then:
              - lambda: |-
                  // `id` here is the writing phone's connection. Each phone gets its own slot,
                  // so two phones with different bedtimes each keep their own hours.
                  uint16_t conn = id;
                  auto &slots = id(slot_conn);
                  int slot = -1;
                  for (int i = 0; i < 3; i++) if (slots[i] == conn) slot = i;
                  for (int i = 0; slot < 0 && i < 3; i++) if (slots[i] < 0) slot = i;
                  if (slot < 0) {
                    ESP_LOGW("hub", "No free slot for connection %u", conn);
                    return;
                  }
                  std::string text(x.begin(), x.end());
                  bool ok = json::parse_json(text, [&](JsonObject root) -> bool {
                    JsonObject s = root["schedule"];
                    if (s.isNull()) return false;
                    // The phone's clock (see the protocol note at the top). The time itself is
                    // the same for every phone; the offsets are each phone's own.
                    if (!root["now"].isNull() && !root["utcOffset"].isNull()) {
                      id(clock_epoch) = (int64_t) root["now"].as<double>();
                      id(clock_millis) = millis();
                      id(have_clock) = true;
                      int offset = root["utcOffset"].as<int>();
                      id(slot_offset)[slot] = offset;
                      id(slot_change_at)[slot] = root["nextOffsetChange"].isNull()
                          ? 0 : (int64_t) root["nextOffsetChange"].as<double>();
                      id(slot_offset_after)[slot] = root["offsetAfterChange"] | offset;
                    }
                    id(slot_limit)[slot] = s["limitToHours"] | true;
                    int usual_start = s["startMinutes"] | 1260;
                    int usual_end = s["endMinutes"] | 420;
                    JsonArray nights = s["nights"];
                    // Per weekday (Sunday first): start, end, or -1 when the night is off.
                    for (int d = 0; d < 7; d++) {
                      int start = usual_start, end = usual_end;
                      if (nights.size() == 7) {
                        JsonObject night = nights[d];
                        if (!night["off"].isNull()) { start = -1; end = -1; }
                        else if (!night["hours"].isNull()) {
                          start = night["hours"]["start"] | usual_start;
                          end = night["hours"]["end"] | usual_end;
                        }
                      }
                      id(slot_hours)[slot * 14 + d * 2] = start;
                      id(slot_hours)[slot * 14 + d * 2 + 1] = end;
                    }
                    return true;
                  });
                  if (ok) slots[slot] = conn;
                  ESP_LOGI("hub", "Schedule %s (%d bytes, phone %d)", ok ? "received" : "unreadable",
                           (int) x.size(), slot + 1);

globals:
  - id: have_clock
    type: bool
    initial_value: "false"
  - id: clock_epoch       # seconds since 1970 when a phone last wrote
    type: int64_t
  - id: clock_millis      # millis() at that moment
    type: uint32_t
  # One slot per connected phone (up to 3). slot_conn is its connection, -1 when free.
  - id: slot_conn
    type: std::array<int, 3>
    initial_value: "{-1, -1, -1}"
  - id: slot_limit        # false: the phone blocks around the clock, so always beat
    type: std::array<bool, 3>
  - id: slot_hours        # per slot, per weekday (Sunday first): start, end minutes or -1
    type: std::array<int, 42>
  - id: slot_offset       # the phone's offset from UTC, in seconds
    type: std::array<int, 3>
  - id: slot_change_at    # its next daylight-saving change, seconds since 1970 (0 = none)
    type: std::array<int64_t, 3>
  - id: slot_offset_after # its offset after that change
    type: std::array<int, 3>
  - id: was_awake
    type: bool
    initial_value: "false"

script:
  # Beats while ANY connected phone is inside its bedtime hours. Each phone's app only blocks
  # inside its own hours, so extra beats during someone else's hours just keep its reading fresh.
  - id: send_heartbeat
    then:
      - lambda: |-
          // Port of BedtimeSchedule.contains: a night belongs to the day it starts on.
          auto length = [](int start, int end) {
            int len = ((end - start) % 1440 + 1440) % 1440;
            return len == 0 ? 1440 : len;
          };
          // Unsigned subtraction survives millis() wrapping (every ~49 days).
          int64_t now = id(clock_epoch) + (uint32_t) (millis() - id(clock_millis)) / 1000;
          bool any_phone = false;
          bool awake = false;
          for (int slot = 0; slot < 3 && !awake; slot++) {
            if (id(slot_conn)[slot] < 0) continue;
            any_phone = true;
            if (!id(slot_limit)[slot]) { awake = true; break; }
            bool changed = id(slot_change_at)[slot] > 0 && now >= id(slot_change_at)[slot];
            int64_t local = now + (changed ? id(slot_offset_after)[slot] : id(slot_offset)[slot]);
            int64_t days = local / 86400;
            int minutes = (int) (local % 86400) / 60;
            int today = (int) ((days + 4) % 7);   // 1 Jan 1970 was a Thursday; 0 = Sunday
            int yesterday = (today + 6) % 7;
            const int *h = &id(slot_hours)[slot * 14];
            if (h[yesterday * 2] >= 0) {
              int since = minutes + 1440 - h[yesterday * 2];
              if (since < length(h[yesterday * 2], h[yesterday * 2 + 1])) awake = true;
            }
            if (!awake && h[today * 2] >= 0) {
              int start = h[today * 2];
              awake = minutes >= start && minutes - start < length(start, h[today * 2 + 1]);
            }
          }
          // Like the iPad: no phone has sent its hours (or the clock) yet, so beat.
          if (!any_phone || !id(have_clock)) awake = true;
          if (awake) {
            id(heartbeat).set_value(std::vector<uint8_t>{1});
            id(heartbeat).notify();
          } else if (id(was_awake)) {
            id(heartbeat).set_value(std::vector<uint8_t>{0});
            id(heartbeat).notify();
          }
          id(was_awake) = awake;

interval:
  - interval: 2s
    then:
      - script.execute: send_heartbeat
